name: Verify private Hugging Face preview status
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-hf-private.yml
jobs:
  verify-hf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'huggingface_hub>=0.36,<2'
      - name: Confirm private dataset and Space and inspect Space build
        shell: bash
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          token = os.environ.get('HF_TOKEN')
          if not token:
              raise SystemExit('Missing HF_TOKEN; no status check performed')
          api = HfApi(token=token)
          repo='Reppo-labs/reppo-rewardbench'
          ds=api.repo_info(repo, repo_type='dataset')
          sp=api.repo_info(repo, repo_type='space')
          if not (ds.private and sp.private):
              raise SystemExit('Expected both HF repositories to be private')
          print('Dataset exists and is private.')
          print('Space exists and is private.')
          runtime=api.get_space_runtime(repo)
          stage=getattr(runtime,'stage',None)
          print('Space build/runtime stage:',stage or 'not yet reported')
          if stage in {'BUILD_ERROR', 'RUNTIME_ERROR', 'CONFIG_ERROR'}:
              raise SystemExit('Space requires a build fix; see HF Space logs')
          PY
