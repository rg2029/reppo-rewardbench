name: Assemble label-unselected coding-agent source sample
on:
  push:
    paths:
      - .github/workflows/assemble-representative-coding.yml
jobs:
  freeze-data:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public S3 reader
        run: python -m pip install boto3
      - name: Freeze public candidate patches before paid scoring
        env:
          PYTHONPATH: tools:.
        run: python tools/assemble_representative_coding.py
      - name: Store selection manifest and archived-verifier references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: label-unselected-coding-preflight
          path: runs/representative-coding-preflight/
          if-no-files-found: warn
          retention-days: 60
