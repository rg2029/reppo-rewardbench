name: Freeze 50 natural human-preference pairs (no API calls)
on:
  push:
    paths:
      - .github/workflows/freeze-subjective-natural.yml
jobs:
  freeze-public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze label-blind random reference sample
        run: python tools/assemble_subjective_natural.py
      - name: Archive frozen sample for manual privacy review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subjective-natural-preflight-50
          path: runs/subjective-natural-preflight/
          if-no-files-found: warn
          retention-days: 90
