name: Set RewardBench Space to CPU Basic
on:
  push:
    paths:
      - .github/workflows/set-hf-cpu.yml
  workflow_dispatch:
jobs:
  configure-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hugging Face SDK
        run: python -m pip install 'huggingface_hub>=0.36,<2'
      - name: Configure free CPU Basic hardware
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token=os.environ.get('HF_TOKEN')
          if not token: raise SystemExit('Missing secret, no configuration changed')
          api=HfApi(token=token)
          repo='Reppo-labs/reppo-rewardbench'
          info=api.repo_info(repo,repo_type='space')
          if not info.private: raise SystemExit('Space unexpectedly public; refusing hardware change')
          rt=api.get_space_runtime(repo)
          print('Before: stage=',rt.stage,'hardware=',rt.hardware,'requested=',rt.requested_hardware,flush=True)
          if rt.hardware!='cpu-basic' and rt.requested_hardware!='cpu-basic':
              print('Requesting CPU Basic (not paid GPU hardware).',flush=True)
              api.request_space_hardware(repo_id=repo, hardware='cpu-basic')
          rt=api.get_space_runtime(repo)
          print('After: stage=',rt.stage,'hardware=',rt.hardware,'requested=',rt.requested_hardware,flush=True)
          PY
