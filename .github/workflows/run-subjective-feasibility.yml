name: One-time paid Reppo subjective preference feasibility
on:
  push:
    paths:
      - .github/workflows/run-subjective-feasibility.yml
concurrency:
  group: reppo-rewardbench-paid-live
  cancel-in-progress: false
jobs:
  subjective-six-call-pilot:
    if: github.repository == 'rg2029/reppo-rewardbench' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 160
    permissions:
      contents: read
    env:
      REPPO_API_KEY: ${{ secrets.REPPO_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline safety and rubric regression tests
        run: python -m unittest tests.test_subjective_live_safety -v
      - name: Freeze pinned HelpSteer2 source and separate gold labels
        run: python tools/assemble_human_preference.py
      - name: Run six sequential subjective evaluations; fail closed
        run: python tools/run_subjective_feasibility.py
      - name: Preserve approvals, results, reconciliation state and exact scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subjective-six-call-evidence
          path: runs/subjective-feasibility-v1/
          if-no-files-found: warn
          retention-days: 90
