name: Assemble archived coding-agent pilot
on:
  push:
    paths:
      - .github/workflows/assemble-coding-pilot.yml
  workflow_dispatch:
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install boto3
      - run: python tools/assemble_coding_pilot.py
      - name: Store frozen task and verifier provenance
        uses: actions/upload-artifact@v4
        with:
          name: coding-agent-candidate-preflight
          path: runs/swebench-source-preflight/
          retention-days: 30
